name: Gate

# Reusable quality gate: lint, format, types, tests. Called by build.yml on
# every push/PR and by publish.yml before a release to PyPI.
on:
  workflow_call:
    inputs:
      sonar:
        description: Run the SonarQube Cloud scan (requires the SONAR_TOKEN secret).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: macos-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy .

      - name: Test with coverage
        run: uv run pytest --cov=calque --cov-report=xml --cov-report=term-missing

      - name: SonarQube scan
        if: inputs.sonar && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
